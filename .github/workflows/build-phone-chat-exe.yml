name: Build Peter Phone Chat EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run_phone_chat.py"
      - "core/chat/**"
      - ".github/workflows/build-phone-chat-exe.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller
      - name: Build standalone EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --console --name PeterPhoneChat --paths . scripts/run_phone_chat.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PeterPhoneChat-Windows
          path: dist/PeterPhoneChat.exe
          if-no-files-found: error
